services:
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: sqlite:///./data/dogfood.db
      JWT_SECRET_KEY: dogfood-local-compose-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      AUTO_CREATE_DB: "true"
      SEED_ON_START: "true"
      FIXTURES_PATH: /app/fixtures.json
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    volumes:
      - dogfood_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
    environment:
      API_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: ""
      NEXT_PUBLIC_FIXTURE_DATA: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  dogfood_data:
